name: Auto-fix tickets.ts
on:
  push:
    branches:
      - fix-tickets-syntax
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run fix
        run: node fix.js
      - name: Commit and push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git rm fix.js
          git rm .github/workflows/fix-tickets.yml
          git add src/server/functions/tickets.ts
          git commit -m "Fix syntax error in tickets.ts" || echo "No changes"
          git push
